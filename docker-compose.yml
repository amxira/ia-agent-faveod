services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faveod-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: faveod-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  tender-hunter:
    build: .
    container_name: faveod-tender-hunter
    profiles: ["app"]   # start with: docker compose --profile app up
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - qdrant
    command: ["-m", "tender_hunter", "run"]
    restart: unless-stopped

  partner-scout:
    build: .
    container_name: faveod-partner-scout
    profiles: ["app"]
    env_file: .env
    environment:
      SEARXNG_URL: http://searxng:8080
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - searxng
    command: ["-m", "partner_scout", "run", "--source", "searxng"]
    restart: unless-stopped

  event-mapper:
    build: .
    container_name: faveod-event-mapper
    profiles: ["app"]
    env_file: .env
    environment:
      EVENT_SOURCE: ${EVENT_SOURCE:-sample}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: ["-m", "event_mapper", "run", "--source", "sample"]
    restart: unless-stopped

  dashboard:
    build: .
    container_name: faveod-dashboard
    profiles: ["app"]
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: ["-m", "streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    restart: unless-stopped

  notifications:
    build: .
    container_name: faveod-notifications
    profiles: ["notify"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    command: ["-m", "notifications", "check"]
    restart: "no"

volumes:
  qdrant_data:
