services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faveod-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  tender-hunter:
    build: .
    container_name: faveod-tender-hunter
    profiles: ["app"]   # start with: docker compose --profile app up
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - qdrant
    command: ["run"]
    restart: unless-stopped

volumes:
  qdrant_data:
